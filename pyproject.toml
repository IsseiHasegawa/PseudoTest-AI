[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pseudotest-ai"
version = "0.2.0"
description = "Hybrid function mutation testing with separate Nemotron test improvement"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pytest>=7.4"]

[project.scripts]
pseudotest = "pseudotest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
